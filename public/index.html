<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SumantX AI</title>
    <!-- Public folder wali style.css ko link kiya gaya hai -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <h2>SumantX AI</h2>
    </header>

    <div class="chat-container" id="chat">
        <div class="msg bot">Namaste! Main SumantX AI hoon. Mujhse koi bhi sawaal puchiye!</div>
    </div>

    <div class="input-bar">
        <input type="text" id="userInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMsg()">
        <button onclick="sendMsg()">Send</button>
    </div>

    <script>
        async function sendMsg() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const prompt = input.value.trim();
            if (!prompt) return;

            // User message screen par show karein
            chat.innerHTML += `<div class="msg user">${prompt}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            // Loading indicator
            const loading = document.createElement('div');
            loading.className = 'msg bot';
            loading.innerText = 'Soch raha hoon...';
            chat.appendChild(loading);
            chat.scrollTop = chat.scrollHeight;

            try {
                // Render Backend API call
                const res = await fetch('https://nano-gpt-web.onrender.com/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                const data = await res.json();
                loading.innerText = data.reply;
            } catch (err) {
                loading.innerText = 'Render server se connect nahi ho pa raha hai. Kripya thoda intezaar karein.';
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SumantX AI</title>
    <!-- Public folder me rakhi style.css ka link -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <header class="chat-header">
            <h2>SumantX AI</h2>
        </header>

        <!-- Messages Box -->
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                <span>Hello! Main SumantX AI hoon. Mujhse sawal puchhein!</span>
            </div>
        </div>

        <!-- Input Area -->
        <form class="chat-input-area" id="chat-form" onsubmit="event.preventDefault();">
            <input 
                type="text" 
                id="user-input" 
                placeholder="Ask anything..." 
                autocomplete="off"
                required
            >
            <button type="submit" id="send-btn">&#10148;</button>
        </form>
    </div>

    <!-- Public folder me rakhi script.js ka link -->
    <script src="/script.js"></script>
</body>
</html>

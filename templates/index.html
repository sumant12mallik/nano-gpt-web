<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoGPT Workspace</title>
  <link rel="stylesheet" href="/static/style.css">

</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="logo-area">
      <span class="logo-text">NanoGPT</span>
      <span class="badge">Self-Trained LLM</span>
    </div>
  </header>

  <!-- Main Chat Conversation Screen -->
  <main id="chat-container">
    <div class="message ai">
      <div class="sender-tag">NanoGPT</div>
      <div class="bubble-text">Hello! Main scratch se bana AI hoon. Mujhse sawal puchhein!</div>
    </div>
  </main>

  <!-- Bottom Message Input Area -->
  <footer class="footer-input">
    <div class="input-wrapper">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Ask anything..." 
        autocomplete="off"
      />
      <button id="send-btn" onclick="handleSend()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </footer>

  <script src="/static/script.js"></script>

</body>
</html>
